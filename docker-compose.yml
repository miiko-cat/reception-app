services:
  # データベースの設定
  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data  # ★データの永続化設定！コンテナを消してもデータが残ります
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  # Djangoアプリの設定
  web:
    build: .
    restart: unless-stopped
    # コンテナ起動時に「静的ファイルの集約」「マイグレーション」「起動」を自動で連続実行します
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn reception_app.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/code
    expose:
      - "8000"  # コンテナ間(nginx→web)にのみ公開。ホストPCやLANからは直接繋がらない
    depends_on:
      - db
    env_file:
      - .env

  # リバースプロキシ(TLS終端)
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"    # HTTP(自動的に443へリダイレクトされる)
      - "443:443"  # HTTPS
    depends_on:
      - web

volumes:
  postgres_data: